{% extends "base.html" %}

{% block title %}Sign in{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ asset('css/login.css') }}">{% endblock %}

{% block content %}
<section class="login-wrap">
  <div class="login-card card">
    <div class="login-head">
      <div class="login-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="m24 3 17 9.8v22.4L24 45 7 35.2V12.8L24 3Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15 24 6 6 12-13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="24" r="4" fill="currentColor"/></svg></div>
      <p class="login-kicker"><span></span> Agentic workspace OS</p>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to your workspace.</p>
    </div>
    <form id="login-form" class="login-form" novalidate>
      <label class="field">
        <span>User ID</span>
        <input id="user_id" name="user_id" type="text" autocomplete="username" autocapitalize="none"
               spellcheck="false" maxlength="64" required data-label="User ID" data-autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password"
               maxlength="128" required data-label="Password">
      </label>
      <button type="submit" id="login-submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </div>
</section>
{% endblock %}

{% block scripts %}<script src="{{ asset('js/login.js') }}"></script>{% endblock %}
