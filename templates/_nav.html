<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/panel" aria-label="100x ERP home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.5 20 7v10l-8 4.5L4 17V7l8-4.5Zm0 4.1L8 8.8v6.4l4 2.2 4-2.2V8.8l-4-2.2Z" fill="currentColor"/><path d="m9.4 12 1.7 1.7 3.7-3.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-word">100x <em>ERP</em></span></a>
    <nav class="topbar-links" aria-label="Main">
      <a href="/panel" class="{% if active == 'panel' %}active{% endif %}"><span aria-hidden="true">⌘</span> Panel</a>
      <a href="/performance" id="nav-performance" class="{% if active == 'performance' %}active{% endif %}"><span aria-hidden="true">◈</span> My dashboard</a>
    </nav>
    <div class="topbar-user">
      <span id="nav-user-name" class="user-name"></span>
      <span id="nav-user-role" class="badge"></span>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark theme" aria-pressed="false" title="Toggle dark theme">
        <svg class="icon icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        <span class="theme-toggle-label">Theme</span>
      </button>
      <button type="button" id="logout-btn" class="btn btn-small">Log out</button>
    </div>
  </div>
</header>
